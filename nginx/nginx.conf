worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # ─── HTTP → HTTPS redirect ──────────────────────────────────────────
    server {
        listen 80;
        server_name devradarai.com www.devradarai.com 188.240.81.48;

        # Let's Encrypt ACME challenge — direkt dosyadan sun
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type text/plain;
            try_files $uri =404;
        }

        # Her şeyi HTTPS'e yönlendir
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS server ──────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name devradarai.com www.devradarai.com;

        ssl_certificate     C:/ssl/devradarai.com-chain.pem;
        ssl_certificate_key C:/ssl/devradarai.com-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Proxy to Spring Boot
        location / {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # API rate limiting
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
