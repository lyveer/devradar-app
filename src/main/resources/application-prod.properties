# ===================== AI Providers =====================
ai.provider=${AI_PROVIDER:groq}

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}

claude.api.key=${CLAUDE_API_KEY:}
claude.model=${CLAUDE_MODEL:claude-3-haiku-20240307}

groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

perplexity.api.key=${PERPLEXITY_API_KEY:}
perplexity.model=${PERPLEXITY_MODEL:sonar}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

gemini.timeout.connect-ms=5000
gemini.timeout.read-ms=30000

# ===================== HTTPS / Reverse Proxy (Nginx) =====================
server.forward-headers-strategy=native
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.internal-proxies=.*
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
security.require-ssl=true

