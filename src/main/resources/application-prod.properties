# ===================== Server =====================
server.port=${PORT:8080}

# ===================== Database (MySQL) =====================
# VDS'teki MySQL bilgilerini buraya gir
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/devradar?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console KAPALI (production'da güvenlik riski)
spring.h2.console.enabled=false

# ===================== JWT =====================
